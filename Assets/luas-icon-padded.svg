<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<!-- White-trial AppIcon: full-bleed 1024, ghost scale(1.85) ≈78% canvas.
     bg white · ghost black · eyes white. Dark backup: AppIcon-dark-1024.png / luas-icon-dark.svg -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#F2F3F5"/>
  </linearGradient>
  <radialGradient id="top" cx="380" cy="80" r="720" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#000" stop-opacity=".04"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow" cx="512" cy="480" r="480" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#3D6DFF" stop-opacity=".10"/>
    <stop offset=".55" stop-color="#3D6DFF" stop-opacity=".03"/>
    <stop offset="1" stop-color="#3D6DFF" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gh" x1="0" y1="80" x2="0" y2="920" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#2A2B30"/>
    <stop offset="1" stop-color="#111215"/>
  </linearGradient>
</defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect width="1024" height="1024" fill="url(#top)"/>
<rect width="1024" height="1024" fill="url(#glow)"/>
<g transform="translate(512 512) scale(1.85) translate(-512 -512)">
  <g transform="translate(0,-10)">
